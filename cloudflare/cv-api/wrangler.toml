name = "cv-api"
main = "src/index.js"
compatibility_date = "2023-12-01"

# KV Namespace binding
kv_namespaces = [
  { binding = "CV_DATA", id = "YOUR_KV_NAMESPACE_ID", preview_id = "YOUR_PREVIEW_KV_NAMESPACE_ID" }
]

# Route configuration (replace with your domain)
# routes = [
#   { pattern = "api.yourdomain.com/cv/*", zone_name = "yourdomain.com" }
# ]

# Triggers
[triggers]
crons = ["0 0 * * *"] # Run once a day to refresh cache if needed
